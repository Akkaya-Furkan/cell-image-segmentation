[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p25-cellseg"
version = "0.1.0"
description = "CPU nuclei segmentation benchmark with held-out reference masks"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-image", "matplotlib", "tifffile", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
